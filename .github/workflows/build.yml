name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          mkdir -p source
          unzip -o *.zip -d source
          echo "=== PROJECT FILES ==="
          find source -maxdepth 5 -type f | head -200

      - name: Build
        run: |
          GRADLE_FILE=$(find source -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: build.gradle табылмады!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowClient-JAR
          path: '**/build/libs/*.jar'
