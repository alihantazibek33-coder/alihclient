name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          unzip -o "ShadowClient-Combat-1.21.4-source.zip" -d source
          find source -name gradlew -type f

      - name: Build mod
        run: |
          cd source/ShadowClient-Combat-1.21.4
          chmod +x gradlew
          ./gradlew build
