name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find ZIP and extract
        run: |
          unzip -o *.zip -d source
          find source -name gradlew -type f

      - name: Build mod
        run: |
          cd "$(dirname "$(find source -name gradlew -type f | head -n 1)")"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShadowClient-JAR
          path: source/**/build/libs/*.jar
